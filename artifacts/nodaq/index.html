    <!--
      Flash-prevention: apply theme before first paint.

      US-A8.1 — sans choix explicite, c'est le SYSTÈME qui tranche. Le défaut
      sombre en dur était une hypothèse d'usage de bureau : en plein soleil,
      un fond sombre est le pire cas, quel que soit son contraste calculé.
      Le paysagiste dont le téléphone bascule en clair dehors obtient le
      thème clair sans avoir rien à régler.

      Ce script décide du PREMIER rendu ; `src/contexts/theme-context.tsx`
      décide de la suite. Les deux doivent trancher pareil, sinon l'écran
      bascule visiblement à chaque chargement — c'est ce qu'éprouve
      `src/contexts/theme-context.test.tsx`, qui évalue CE script et compare.
    -->
    <script>
      (function () {
        var t = localStorage.getItem('nodaq-theme');
        var isDark =
          t === 'dark' || t === 'light'
            ? t === 'dark'
            : !window.matchMedia('(prefers-color-scheme: light)').matches;
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
