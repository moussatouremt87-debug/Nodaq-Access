          type: string
        message:
          $ref: "#/components/schemas/ChatMessage"
        actions_proposees:
          type: array
          items:
            $ref: "#/components/schemas/AgentAction"
        binaryDiscarded:
          type: boolean
          description: >
            Always true in this version — the image binary is not stored.
            Binary storage (object storage + classeur thumbnail) is tracked
            in a follow-up task.
        document:
          type: object
          required: [name, documentType, summary]
          properties:
            name:
              type: string
              description: Auto-generated classeur document name
            documentType:
              type: string
            summary:
              type: string

