openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: NODAQ API — AI-powered business management for French SMEs
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: cockpit
  - name: affaires
  - name: contrats
  - name: factures
  - name: prospects
  - name: brief
  - name: pending-actions
  - name: chat
  - name: devis
  - name: classeur
  - name: echeances
  - name: marge
  - name: rapports
  - name: equipe
  - name: connecteurs
  - name: parametres

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Cockpit ─────────────────────────────────────────────────────────────
  /cockpit/kpis:
    get:
      operationId: getCockpitKpis
      tags: [cockpit]
      summary: Dashboard KPIs
      responses:
        "200":
          description: KPI snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CockpitKpis"

  /cockpit/activity:
    get:
      operationId: getCockpitActivity
      tags: [cockpit]
      summary: Recent activity feed
      responses:
        "200":
          description: Activity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # ── Affaires ─────────────────────────────────────────────────────────────
  /affaires:
    get:
      operationId: listAffaires
      tags: [affaires]
      summary: List affaires
      parameters:
        - in: query
          name: statut
          schema:
            type: string
        - in: query
          name: inclureArchivees
          schema:
            type: boolean
      responses:
        "200":
          description: List of affaires
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffaireList"
    post:
      operationId: createAffaire
      tags: [affaires]
      summary: Create an affaire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AffaireInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Affaire"

  /affaires/{id}:
    get:
      operationId: getAffaire
      tags: [affaires]
      summary: Get a single affaire
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Affaire detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Affaire"
        "404":
          description: Not found
    patch:
      operationId: updateAffaire
      tags: [affaires]
      summary: Update an affaire
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AffaireUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Affaire"
        "404":
          description: Not found
    delete:
      operationId: deleteAffaire
      tags: [affaires]
      summary: Delete an affaire
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /affaires/stats:
    get:
      operationId: getAffaireStats
      tags: [affaires]
      summary: Affaire pipeline stats by status
      responses:
        "200":
          description: Pipeline breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffaireStats"

  # ── Contrats ──────────────────────────────────────────────────────────────
  /contrats:
    get:
      operationId: listContrats
      tags: [contrats]
      summary: List recurring contracts
      responses:
        "200":
          description: List of contrats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contrat"
    post:
      operationId: createContrat
      tags: [contrats]
      summary: Create a contrat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContratInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contrat"

  /contrats/{id}:
    patch:
      operationId: updateContrat
      tags: [contrats]
      summary: Update a contrat
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContratUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contrat"
        "404":
          description: Not found
    delete:
      operationId: deleteContrat
      tags: [contrats]
      summary: Delete a contrat
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ── Factures / Invoices ───────────────────────────────────────────────────
  /factures:
    get:
      operationId: listFactures
      tags: [factures]
      summary: List invoices
      parameters:
        - in: query
          name: settled
          schema:
            type: boolean
      responses:
        "200":
          description: Invoice list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactureList"
    post:
      operationId: createFacture
      tags: [factures]
      summary: Create an invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FactureInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Facture"

  /factures/{id}:
    patch:
      operationId: updateFacture
      tags: [factures]
      summary: Update invoice (mark settled, etc.)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FactureUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Facture"
        "404":
          description: Not found

  # ── Prospects ────────────────────────────────────────────────────────────
  /prospects:
    get:
      operationId: listProspects
      tags: [prospects]
      summary: List prospects
      parameters:
        - in: query
          name: stage
          schema:
            type: string
      responses:
        "200":
          description: List of prospects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prospect"
    post:
      operationId: createProspect
      tags: [prospects]
      summary: Create a prospect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProspectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prospect"

  /prospects/{id}:
    patch:
      operationId: updateProspect
      tags: [prospects]
      summary: Update a prospect
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProspectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prospect"
        "404":
          description: Not found
    delete:
      operationId: deleteProspect
      tags: [prospects]
      summary: Delete a prospect
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ── Brief matin ──────────────────────────────────────────────────────────
  /brief:
    get:
      operationId: getBrief
      tags: [brief]
      summary: Get today's morning brief
      responses:
        "200":
          description: Morning brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brief"

  # ── Pending actions ───────────────────────────────────────────────────────
  /pending-actions:
    get:
      operationId: listPendingActions
      tags: [pending-actions]
      summary: List pending actions
      responses:
        "200":
          description: List of pending actions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingAction"

  /pending-actions/{id}/approve:
    post:
      operationId: approvePendingAction
      tags: [pending-actions]
      summary: Approve a pending action
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionDecision"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingAction"

  /pending-actions/{id}/reject:
    post:
      operationId: rejectPendingAction
      tags: [pending-actions]
      summary: Reject a pending action
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionDecision"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingAction"

  # ── Devis ─────────────────────────────────────────────────────────────────
  /devis:
    get:
      operationId: listDevis
      tags: [devis]
      summary: List devis
      parameters:
        - in: query
          name: statut
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: List of devis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevisList"
    post:
      operationId: createDevis
      tags: [devis]
      summary: Create a devis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevisInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Devis"

  /devis/{id}:
    get:
      operationId: getDevis
      tags: [devis]
      summary: Get a devis
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Devis detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Devis"
        "404":
          description: Not found
    patch:
      operationId: updateDevis
      tags: [devis]
      summary: Update a devis
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevisUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Devis"
        "404":
          description: Not found
    delete:
      operationId: deleteDevis
      tags: [devis]
      summary: Delete a devis
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /devis/{id}/convert:
    post:
      operationId: convertDevisToAffaire
      tags: [devis]
      summary: Convert accepted devis to affaire
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Affaire created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Affaire"
        "404":
          description: Not found

  # ── Classeur ────────────────────────────────────────────────────────────────
  /classeur:
    get:
      operationId: listClasseur
      tags: [classeur]
      summary: List documents in classeur
      parameters:
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClasseurList"
    post:
      operationId: createClasseurDocument
      tags: [classeur]
      summary: Add a document to classeur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClasseurDocumentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClasseurDocument"

  /classeur/{id}:
    delete:
      operationId: deleteClasseurDocument
      tags: [classeur]
      summary: Delete a document from classeur
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ── Échéances fiscales ───────────────────────────────────────────────────────
  /echeances:
    get:
      operationId: listEcheances
      tags: [echeances]
      summary: List fiscal deadlines
      parameters:
        - in: query
          name: statut
          schema:
            type: string
      responses:
        "200":
          description: List of echeances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Echeance"
    post:
      operationId: createEcheance
      tags: [echeances]
      summary: Create a fiscal deadline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EcheanceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Echeance"

  /echeances/{id}:
    patch:
      operationId: updateEcheance
      tags: [echeances]
      summary: Update a fiscal deadline
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EcheanceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Echeance"
        "404":
          description: Not found
    delete:
      operationId: deleteEcheance
      tags: [echeances]
      summary: Delete a fiscal deadline
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ── Marge ────────────────────────────────────────────────────────────────────
  /marge:
    get:
      operationId: getMargeStats
      tags: [marge]
      summary: Global margin analytics
      parameters:
        - in: query
          name: statut
          schema:
            type: string
      responses:
        "200":
          description: Margin statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MargeStats"

  # ── Rapports mensuels ────────────────────────────────────────────────────────
  /rapports/mensuel:
    get:
      operationId: getRapportMensuel
      tags: [rapports]
      summary: Get monthly business report
      parameters:
        - in: query
          name: mois
          schema:
            type: string
            description: "YYYY-MM format"
      responses:
        "200":
          description: Monthly report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RapportMensuel"

  # ── Chat ─────────────────────────────────────────────────────────────────
  /chat/messages:
    get:
      operationId: getChatHistory
      tags: [chat]
      summary: Get chat history
      parameters:
        - in: query
          name: conversationId
          schema:
            type: string
      responses:
        "200":
          description: Chat messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatHistory"
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a chat message to the AI agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: Agent reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReply"

  /chat/suggestions:
    get:
      operationId: getChatSuggestions
      tags: [chat]
      summary: Get contextual conversation suggestions for the current tenant
      responses:
        "200":
          description: Suggestion pills for the chat empty state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSuggestions"

  /chat/upload:
    post:
      operationId: uploadChatImage
      tags: [chat]
      summary: Upload an image/document for Pixtral analysis and agent routing
      description: >
        Accepts multipart/form-data with fields: image (file, required),
        text (string, optional caption), conversationId (string, optional).
        Not called via generated client — use FormData + fetch directly.
      responses:
        "201":
          description: Image analysed, agent ran, classeur entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatUploadReply"
        "400":
          description: No image file provided
        "503":
          description: MISTRAL_API_KEY not configured

  /chat/transcribe:
    post:
      operationId: transcribeChatAudio
      tags: [chat]
      summary: Transcribe an audio recording via Scaleway STT (Whisper)
      description: >
        Accepts multipart/form-data with field: audio (file, required).
        Not called via generated client — use FormData + fetch directly.
      responses:
        "200":
          description: Transcription result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscribeReply"
        "400":
          description: No audio file provided
        "503":
          description: SCALEWAY_API_KEY not configured

  # ── Équipe ───────────────────────────────────────────────────────────────
  /equipe:
    get:
      operationId: listTeamMembers
      tags: [equipe]
      summary: List team members
      responses:
        "200":
          description: List of team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
    post:
      operationId: createTeamMember
      tags: [equipe]
      summary: Create a team member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"

  /equipe/{id}:
    patch:
      operationId: updateTeamMember
      tags: [equipe]
      summary: Update a team member
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "404":
          description: Not found
    delete:
      operationId: deleteTeamMember
      tags: [equipe]
      summary: Delete a team member
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ── Connecteurs ───────────────────────────────────────────────────────────
  /connecteurs:
    get:
      operationId: listConnectors
      tags: [connecteurs]
      summary: List available connectors
      responses:
        "200":
          description: Connector list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorList"

  /connecteurs/{type}:
    patch:
      operationId: updateConnector
      tags: [connecteurs]
      summary: Update connector status and config
      parameters:
        - in: path
          name: type
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorItem"
        "404":
          description: Not found

  # ── Paramètres ───────────────────────────────────────────────────────────
  /parametres:
    get:
      operationId: getParametres
      tags: [parametres]
      summary: Get all settings as key-value map
      responses:
        "200":
          description: Settings map
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
    patch:
      operationId: updateParametres
      tags: [parametres]
      summary: Update one or more settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParametresInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Cockpit ──────────────────────────────────────────────────────────────
    CockpitKpis:
      type: object
      required: [affairesEnCours, chiffreAffairesMois, facturesEnAttente, totalImpayeCents, prospectsPipeline, contratsActifs, pendingActionsCount]
      properties:
        affairesEnCours:
          type: number
        chiffreAffairesMois:
          type: number
          description: Revenue this month in cents
        facturesEnAttente:
          type: number
        totalImpayeCents:
          type: number
          description: Total overdue in cents
        prospectsPipeline:
          type: number
        contratsActifs:
          type: number
        pendingActionsCount:
          type: number
        treasuryBalanceCents:
          type: ["number", "null"]
        monthlySeries:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyRevenue"
        ytd:
          $ref: "#/components/schemas/CockpitYtd"

    CockpitYtd:
      type: object
      required: [caYtdCents, caPrevYearSamePeriodCents, facturesEmisesYtd, tauxRecouvrement]
      properties:
        caYtdCents:
          type: number
          description: Year-to-date revenue in cents
        caPrevYearSamePeriodCents:
          type: number
          description: Revenue at same point in the previous year in cents
        caGrowthPct:
          type: ["number", "null"]
          description: YoY growth percentage (null when no prior year data)
        facturesEmisesYtd:
          type: number
          description: Number of invoices issued year-to-date
        tauxRecouvrement:
          type: number
          description: Collection rate 0–100

    MonthlyRevenue:
      type: object
      required: [month, revenueCents, invoiceCount]
      properties:
        month:
          type: string
          description: "YYYY-MM"
        revenueCents:
          type: number
        invoiceCount:
          type: number

    ActivityItem:
      type: object
      required: [id, type, label, createdAt]
      properties:
        id:
          type: string
        type:
          type: string
