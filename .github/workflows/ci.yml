name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: Typecheck + RLS Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nodaq_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/nodaq_ci
      SESSION_SECRET: ci-test-session-secret-minimum-32chars
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Database Setup ──────────────────────────────────────────────────
      # Reproduit exactement `pnpm db:setup` :
      #   create-app-role.cjs → migrate.mjs → seed-owner.cjs
      # (les anciens scripts migrate-multitenant.cjs / migrate-rls.cjs ne
      #  créent PAS le schéma : ils supposent les tables déjà présentes.)

      - name: Create app_user and capture DATABASE_URL_APP
        id: setup_appuser
        run: |
          SCRIPT_OUTPUT=$(node lib/db/scripts/create-app-role.cjs)
          DB_APP_URL=$(echo "$SCRIPT_OUTPUT" | grep "^postgres://" | tail -1)
          if [ -z "$DB_APP_URL" ]; then
            echo "ERROR: could not extract DATABASE_URL_APP from create-app-role.cjs output"
            exit 1
          fi
          # Masque la chaîne de connexion (mot de passe compris) dans TOUT le
          # journal, y compris si un script la ré-affiche plus tard.
          echo "::add-mask::$DB_APP_URL"
          echo "db_app_url=$DB_APP_URL" >> "$GITHUB_OUTPUT"
          echo "DATABASE_URL_APP=$DB_APP_URL" >> "$GITHUB_ENV"

      - name: Apply schema + RLS migrations
        run: node lib/db/scripts/migrate.mjs

      - name: Seed owner
        run: node lib/db/scripts/seed-owner.cjs < /dev/null
        env:
          DATABASE_URL_APP: ${{ steps.setup_appuser.outputs.db_app_url }}

      # ── Garde structurelle RLS ──────────────────────────────────────────
      # Toute table qui porte une colonne tenant_id DOIT avoir RLS activée
      # ET forcée. Échoue la CI sinon, en nommant les tables fautives.
      # memberships et sessions sont exclues : ce sont des tables
      # d'infrastructure lues avant l'ouverture d'un contexte tenant.
      - name: Guard — every tenant_id table has RLS enabled AND forced
        run: |
          MISSING=$(psql "$DATABASE_URL" -tA -c "
            SELECT c.relname
                   || ' (enabled=' || c.relrowsecurity
                   || ', forced='  || c.relforcerowsecurity || ')'
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public'
              AND c.relkind = 'r'
              AND c.relname NOT IN ('memberships', 'sessions')
              AND EXISTS (
                SELECT 1 FROM information_schema.columns col
                WHERE col.table_schema = 'public'
                  AND col.table_name   = c.relname
                  AND col.column_name  = 'tenant_id')
              AND NOT (c.relrowsecurity AND c.relforcerowsecurity)
            ORDER BY 1;")
          if [ -n "$MISSING" ]; then
            echo "::error::Tables métier sans RLS ENABLE+FORCE :"
            echo "$MISSING"
            exit 1
          fi
          echo "OK — toutes les tables à tenant_id ont RLS ENABLE + FORCE."

      # ── Typecheck ───────────────────────────────────────────────────────
      - name: Typecheck all workspaces
        run: pnpm run typecheck

      # ── Tests, dans les trois fuseaux ───────────────────────────────────
      #
      # Chaque ticket de ce dépôt exige la suite sous UTC, Europe/Paris et
      # Pacific/Auckland. La CI ne la lançait qu'UNE fois, sur des coureurs en
      # UTC : rien n'avait jamais vérifié quoi que ce soit dans les trois
      # fuseaux. La promesse reposait sur des exécutions locales, elles-mêmes
      # neutralisées par l'épinglage du vitest.config de l'api-server.
      #
      # Auckland n'est pas décoratif : en avance sur UTC, c'est le fuseau qui
      # révèle une date métier construite depuis un instant — un `…T12:00:00Z`
      # y est déjà le lendemain.
      #
      # TROIS ÉTAPES ET NON UNE MATRICE DE JOBS, délibérément : une matrice
      # triplerait le service PostgreSQL, l'installation, la création de
      # `app_user`, les migrations, le seed, la garde `pg_class` et le
      # typecheck — tout ce qui précède, et qui ne dépend pas du fuseau. Seule
      # l'étape de test en dépend, donc seule l'étape de test est répétée.
      #
      # `TZ_ATTENDU` n'est pas une redite de `TZ` : c'est ce que
      # `tools/tests/fuseau-attendu.test.ts` compare au fuseau RÉELLEMENT
      # résolu. Sans elle, un paquet qui ré-épinglerait son fuseau passerait
      # les trois étapes en vert sans jamais quitter Paris.
      #
      # ── `--workspace-concurrency=1` : les paquets, un par un ──────────────
      # La suite api-server monte un serveur éphémère PAR requête supertest —
      # plus de 300 appels — et la réserve de ports éphémères appartient à la
      # MACHINE, pas au processus. Huit paquets lancés ensemble y puisent tous.
      #
      # Mesuré : 5000 cycles listen/requête/close en isolation ne produisent
      # aucune erreur ; les mêmes à huit processus simultanés épuisent la
      # réserve (`EADDRNOTAVAIL`). C'est cette contention qui rendait des
      # `ECONNRESET` intermittents, sur un test différent à chaque fois.
      #
      # Sérialiser coûte du temps de mur et rend le vert signifiant. Le détail
      # de l'enquête est dans `flottements-suite.test.ts`.

      - name: Tests — TZ=UTC
        run: pnpm -r --workspace-concurrency=1 --if-present run test
        env:
          DATABASE_URL_APP: ${{ steps.setup_appuser.outputs.db_app_url }}
          TZ: UTC
          TZ_ATTENDU: UTC

      - name: Tests — TZ=Europe/Paris
        run: pnpm -r --workspace-concurrency=1 --if-present run test
        env:
          DATABASE_URL_APP: ${{ steps.setup_appuser.outputs.db_app_url }}
          TZ: Europe/Paris
          TZ_ATTENDU: Europe/Paris

      - name: Tests — TZ=Pacific/Auckland
        run: pnpm -r --workspace-concurrency=1 --if-present run test
        env:
          DATABASE_URL_APP: ${{ steps.setup_appuser.outputs.db_app_url }}
          TZ: Pacific/Auckland
          TZ_ATTENDU: Pacific/Auckland

  # ── services/voice — runtime de l'agent vocal (ticket 4.18) ──────────────
  # Job SÉPARÉ, et pas une étape du job `ci` : ce service ne touche pas la base
  # de données, n'a besoin ni de Postgres, ni des migrations, ni du rôle
  # `app_user`. L'accrocher au job existant lui ferait attendre trois minutes
  # de préparation dont il n'a que faire, et brouillerait l'attribution d'un
  # échec — un ruff rouge n'a rien à voir avec la RLS.
  voice:
    name: services/voice — ruff, mypy, pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/voice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `--frozen` : l'environnement est reconstruit depuis `uv.lock` sans le
      # re-résoudre. Même exigence que `pnpm install --frozen-lockfile` — une
      # CI qui re-résout ne teste pas ce qu'on livre, et un verrou qui dérive
      # ne se voit qu'en production.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint — ruff
        run: uv run ruff check .

      - name: Types — mypy (strict)
        run: uv run mypy

      - name: Tests — pytest
        run: uv run pytest -q
