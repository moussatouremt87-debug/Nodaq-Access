[project]
name = "nodaq-voice"
version = "0.1.0"
description = "Outbound voice agent runtime — dunning calls (ticket 4.18)."
requires-python = ">=3.12"
# `httpx` and nothing else. The ElevenLabs adapter speaks plain HTTP rather
# than taking the vendor SDK: three endpoints do not justify a dependency, a
# release cadence and a surface — and it keeps the adapter readable as exactly
# what goes over the wire, which matters when what goes over the wire is
# personal data leaving the sovereign perimeter.
#
# Kokoro-82M and Chatterbox Multilingual were installed here during the August
# 2026 evaluation and removed once the arbitration was made (ADR 002): keeping
# fourteen gigabytes of weights in the manifest would describe a product we do
# not ship. The measurements survive in the ADR.
dependencies = [
    "httpx>=0.28.1",
    # Connexion permanente pour la transcription en continu (ADR 004). Ce n'est
    # pas un SDK de fournisseur — c'est le protocole WebSocket — donc la garde
    # de couches de `test_layering.py` n'a pas à s'en émouvoir.
    "websockets>=13.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice"]

[tool.ruff]
line-length = 96
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
# Same doctrine as the TypeScript side: silencing the checker hides a cause
# instead of treating it. `Any` needs a reason, and the reason has to be
# written down.
disallow_any_explicit = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
